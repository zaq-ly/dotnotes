name: dotnotes
description: Notes, Reminders, and Alarms with Gmail & Calendar integration
publish_to: 'none'
version: 1.0.3+103

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  flutter_riverpod: ^2.5.1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  dio: ^5.4.3
  supabase_flutter: ^2.5.6
  google_sign_in: ^6.2.1
  googleapis: ^13.2.0
  googleapis_auth: ^1.6.0
  extension_google_sign_in_as_googleapis_auth: ^2.0.12
  flutter_local_notifications: ^17.1.2
  path_provider: ^2.1.3
  uuid: ^4.4.0
  intl: ^0.19.0
  timezone: ^0.9.2
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.9
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "assets/Logo dotnotes.jpg"
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/Logo dotnotes.jpg"

flutter:
  uses-material-design: true
  assets:
    - assets/
