name: Supabase Keep-Alive

on:
  schedule:
    # Jalan setiap 5 hari sekali (Supabase pause setelah 7 hari inaktif)
    - cron: '0 0 */5 * *'
  workflow_dispatch: # Bisa trigger manual dari GitHub Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}")
          echo "Response status: $STATUS"
          if [ "$STATUS" -ge 200 ] && [ "$STATUS" -lt 300 ]; then
            echo "Supabase is alive."
          else
            echo "Unexpected status: $STATUS" && exit 1
          fi
