name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK (split-per-abi)
        run: flutter build apk --release --split-per-abi

      - name: Rename and prepare APKs
        run: |
          TAG="${{ github.ref_name }}"
          cd build/app/outputs/flutter-apk
          for f in app-*-release.apk; do
            [ -f "$f" ] || continue
            ABI=$(echo "$f" | sed 's/^app-//' | sed 's/-release\.apk$//')
            cp "$f" "dotnotes-${TAG}-${ABI}.apk"
            rm "$f"
          done

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/dotnotes-*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
